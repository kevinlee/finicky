name: FinickyIntegrations
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  FinickyActions:
    type: application
    platform: macOS
    productName: Finicky Actions
    sources:
      - App
      - Intents
      - Shared
      - path: ../../LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlee.finicky.actions
        PRODUCT_NAME: Finicky Actions
        PRODUCT_MODULE_NAME: FinickyActions
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FinickyActions.entitlements
    dependencies:
      - target: FinickySafari
        embed: true
      - target: FinickyShare
        embed: true
      - target: FinickyFocus
        embed: true
    scheme:
      testTargets:
        - FinickyIntegrationTests
  FinickySafari:
    type: app-extension
    platform: macOS
    productName: Finicky Safari
    sources:
      - Safari
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlee.finicky.actions.safari
        PRODUCT_NAME: Finicky Safari
        PRODUCT_MODULE_NAME: FinickySafari
        INFOPLIST_FILE: Safari/Info.plist
        CODE_SIGN_ENTITLEMENTS: Safari/FinickySafari.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  FinickyShare:
    type: app-extension
    platform: macOS
    productName: Open with Finicky Plus
    sources:
      - Share
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlee.finicky.actions.share
        PRODUCT_NAME: Open with Finicky Plus
        PRODUCT_MODULE_NAME: FinickyShare
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/FinickyShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  FinickyFocus:
    type: extensionkit-extension
    platform: macOS
    productName: Finicky Focus
    sources:
      - Focus
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlee.finicky.actions.focus
        PRODUCT_NAME: Finicky Focus
        PRODUCT_MODULE_NAME: FinickyFocus
        INFOPLIST_FILE: Focus/Info.plist
        CODE_SIGN_ENTITLEMENTS: Focus/FinickyFocus.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  FinickyIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlee.finicky.actions.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
