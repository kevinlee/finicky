name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/finicky/src/go.mod
      - run: npm ci
        working-directory: packages/config-api
      - run: npm ci
        working-directory: packages/finicky-ui
      - run: npm test -- --run
        working-directory: packages/config-api
      - run: npm run check && node --experimental-strip-types --test tests/*.test.mjs
        working-directory: packages/finicky-ui
      - run: BUILD_UNIVERSAL=1 ./scripts/build-fork.sh
      - run: go test -race -count=1 ./...
        working-directory: apps/finicky/src
